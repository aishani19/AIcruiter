services:
  - type: web
    name: alcruiter-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app:app -b 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alcruiter-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false


databases:
  - name: alcruiter-db
    databaseName: alcruiter
    user: alcruiter_user
